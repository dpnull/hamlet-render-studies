<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef1e8"><meta property="og:title" content="Hamlet · 一条安静的小街"><meta property="og:description" content="四栋小房子，一只小豆，几件正在发生的小事。"><meta property="og:image" content="https://dpnull.github.io/hamlet-render-studies/quiet-town/preview.png"><title>Hamlet · 慢慢长出来的小镇</title><link rel="stylesheet" href="style.css"></head>
<body>
<noscript><style>#loading{display:none!important}.no-script-preview{position:fixed;inset:0;z-index:90;background:#e2e8d9;display:flex;flex-direction:column;justify-content:center;align-items:center}.no-script-preview img{width:100%;max-height:80vh;object-fit:contain}.no-script-preview p{font-size:12px;color:#405549;padding:20px;text-align:center}</style><div class="no-script-preview"><img src="__POSTER__" alt="Hamlet 的新设计：四栋柔和色彩的建筑和一条安静的小街"><p>这是小镇的静态预览。启用 JavaScript 后，可以走进小屋、切换暮色和记录小事。</p></div></noscript>
<div id="app">
  <div id="scene" role="img" aria-label="有小屋、邮局、书屋、工坊和小豆的立体小镇"></div>
  <div id="loading"><span class="loading-bean">··</span><p>小镇正在醒来</p></div>
  <header class="topbar">
    <div class="identity"><span class="appmark" aria-hidden="true">h.</span><div id="identity-text"><strong id="identity-title">Hamlet</strong><span id="identity-sub">小镇新作 · 设计提案</span></div></div>
    <div class="glass time-switch" role="group" aria-label="Time of day"><button id="day" class="selected" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg><span data-i18n="day">日光</span></button><button id="dusk" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20.8 14.6A9 9 0 0 1 9.4 3.2 9 9 0 1 0 20.8 14.6Z"/></svg><span data-i18n="dusk">暮色</span></button></div>
    <div class="header-actions"><div id="news" class="glass news" role="region" hidden><span class="news-bean" aria-hidden="true"><i></i></span><b class="news-count" id="news-count"></b><div class="news-items" id="news-items"></div></div><button id="sound" class="glass icon-button" aria-pressed="true" aria-label="Night sounds"></button><button id="language" class="glass icon-button" aria-label="Switch to English">EN</button><button id="about" class="glass icon-button" aria-label="About this design" aria-controls="sheet" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></svg></button></div>
  </header>
  <div class="greeting"><p><span class="weather-dot"></span><span id="weather" data-i18n="weather">午后 · 有一点风</span></p><h1 id="greeting-title" data-i18n="title">日子，在这里慢慢长大。</h1><span id="greeting-caption" data-i18n="caption">有信等你，也有一会儿发呆的时间。</span></div>
  <div class="world-labels" id="labels"></div>
  <div class="side-tools glass"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><span></span><button id="motion" aria-label="Pause ambient movement" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M8 5v14m8-14v14"/></svg></button><button id="reset" aria-label="Return to whole town"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7"/></svg></button></div>
  <div class="bottom-zone"><nav class="glass bottom-nav" aria-label="App navigation"><span class="nav-lens" aria-hidden="true"></span><button id="home-tab" data-sheet="home" aria-controls="sheet" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9H4ZM9 20v-6h6v6"/></svg><span data-i18n="tabHome">小屋</span></button><button id="post-tab" data-sheet="post" aria-controls="sheet" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg><span data-i18n="tabPost">邮局</span><i class="mail-dot"></i></button><button id="library-tab" data-sheet="library" aria-controls="sheet" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5ZM12 6v13.5"/></svg><span data-i18n="tabLibrary">书屋</span></button><button id="workshop-tab" data-sheet="workshop" aria-controls="sheet" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="m8.6 12.3 2.3 2.3 4.6-4.9"/></svg><span data-i18n="tabWorkshop">工坊</span></button></nav><button id="capture" class="glass capture" aria-label="Add" aria-haspopup="menu" aria-controls="add-menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button><div id="add-menu" class="glass add-menu" role="menu" hidden></div></div>
  
  <aside id="sheet" class="glass sheet" hidden tabindex="-1" aria-labelledby="identity-title"><header class="sheet-head"><button class="sheet-close glass" id="close-sheet" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button></header><div class="sheet-body" id="sheet-body"></div></aside>
  <aside id="editor" class="glass editor" hidden aria-labelledby="editor-title"><div class="editor-bar"><button class="editor-btn" id="editor-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><span class="editor-where" id="editor-where"></span><button class="editor-btn" id="editor-delete" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10.5 11v5M13.5 11v5"/></svg></button><button class="editor-btn" id="editor-done" aria-label="Done"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button></div><div class="editor-page"><p class="editor-date" id="editor-date"></p><label class="sr-only" for="editor-title">Title</label><input id="editor-title" class="editor-title" autocomplete="off"><label class="sr-only" for="editor-body">Note</label><textarea id="editor-body" class="editor-body"></textarea></div><div class="pc-desk" id="pc-desk"></div></aside>
  <div id="notice" class="glass notice" role="dialog" aria-labelledby="notice-title" hidden><button class="notice-close" id="notice-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button><span class="notice-model"><canvas id="notice-canvas" aria-hidden="true"></canvas></span><p class="notice-from" id="notice-from"></p><h3 id="notice-title"></h3><p class="notice-body" id="notice-body"></p><button class="primary notice-ok" id="notice-ok"></button></div>
  <canvas id="confetti-fx" aria-hidden="true"></canvas>
</div>
<div id="toast" role="status"></div>
<audio id="night-audio" src="audio/night.m4a" loop preload="auto"></audio>
<script type="module" src="app.js"></script>
</body></html>
